[dependencies.aitran_lang]
version = "0.1.1"
path = "../aitran_lang"

[dependencies.aitran_parse]
version = "0.1.1"
path = "../aitran_parse"

[dev-dependencies]
aok = "0.1.18"
ctor = "1.0.13"
log_init = "0.1.40"
sonic-rs = "0.5.10"

[dev-dependencies.aitran_cli_conf]
path = "../aitran_cli_conf"
version = "0.1.1"

[dev-dependencies.compio]
version = "0.19.2"
features = [ "macros" ]
