[package]
name = "aitran_api"
description = "aitran_api"
keywords = [ ]
categories = [ ]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[features]
default = [ ]

[dependencies]
itoa = "1.0.19"
thiserror = "2.0.21"

[dependencies.ai_api]
version = "0.1.1"
