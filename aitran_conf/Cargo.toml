[package]
name = "aitran_conf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "解析 aii18n.nt 任务配置（NestedText）"
keywords = ["i18n", "config", "nestedtext"]
categories = ["config", "text-processing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
aitran_lang = { version = "0.1.0", path = "../aitran_lang" }
bit-set = "0.11.1"
nested-text = { version = "0.1.0", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
strum = "0.28.0"
thiserror = "2.0.21"
