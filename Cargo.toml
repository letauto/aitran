[workspace]
resolver = "3"
members = [
  "aitran_conf",
  "aitran_cli_conf",
  "aitran_lang",
  "ai_api",
  "aitran_api",
  "md_prefix",
  "aitran_parse",
  "aitran_db",
  "aitran",
  "aitran_log",
  "aitran_progress",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/letauto/aitran"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
